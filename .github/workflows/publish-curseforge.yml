name: Publish CurseForge
run-name: CurseForge ${{ inputs.dry_run && 'dry run' || 'publish' }} (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the JAR and CurseForge credentials without uploading
        type: boolean
        default: true
      release_type:
        description: CurseForge release channel
        type: choice
        options: [beta, release, alpha]
        default: beta

permissions:
  contents: read

concurrency:
  group: curseforge
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - name: Require the release branch for uploads
        if: ${{ !inputs.dry_run }}
        run: test "$GITHUB_REF" = refs/heads/1.21.1

  checks:
    needs: target
    uses: ./.github/workflows/build.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: curseforge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.checks.outputs.artifact_name }}
          path: build/libs
      - name: Validate the tested artifact and upload configuration
        id: release
        env:
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: python3 tools/prepare_release.py --check-api --release-type "$RELEASE_TYPE"
      - name: Dry run complete
        if: ${{ inputs.dry_run }}
        run: echo 'Dry run succeeded. No file was uploaded to CurseForge.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the tested JAR to CurseForge
        if: ${{ !inputs.dry_run }}
        env:
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID || vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: python3 tools/prepare_release.py --upload --release-type "$RELEASE_TYPE"
