name: Build
on:
  push:
    branches: ['1.21.1', 'feature/**']
  pull_request:
    branches: ['1.21.1']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: Singulo-Arsenal-0.1.0-1.21.1N
          path: build/libs/Singulo-Arsenal-0.1.0-1.21.1N.jar
          if-no-files-found: error
