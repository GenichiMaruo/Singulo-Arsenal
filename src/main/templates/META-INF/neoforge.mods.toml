modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/GenichiMaruo/Singulo-Arsenal/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/GenichiMaruo/Singulo-Arsenal"
description='''
The official Singulo weapons and armor addon, built around its materials and lost civilization technology.
Initial development scaffold; equipment content is not implemented yet.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="singulo"
type="required"
versionRange="${singulo_version_range}"
ordering="AFTER"
side="BOTH"
